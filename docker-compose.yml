version: "3.9"

services:
  frontend:
    build: ./frontend
    container_name: incamant-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_PROXY_TARGET: http://backend:3000
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: incamant-backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: node index.js
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${MARIADB_DATABASE:?Define MARIADB_DATABASE en .env}
      DB_USER: ${MARIADB_USER:?Define MARIADB_USER en .env}
      DB_PASSWORD: ${MARIADB_PASSWORD:?Define MARIADB_PASSWORD en .env}
      PORT: 3000
      AUTH_SECRET: ${AUTH_SECRET:?Define AUTH_SECRET en .env}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:11
    container_name: incamant-db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Define MARIADB_ROOT_PASSWORD en .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?Define MARIADB_DATABASE en .env}
      MARIADB_USER: ${MARIADB_USER:?Define MARIADB_USER en .env}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Define MARIADB_PASSWORD en .env}
    ports:
      - "3306:3306"
    volumes:
      - ./database:/docker-entrypoint-initdb.d
